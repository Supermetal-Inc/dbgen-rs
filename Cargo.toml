[package]
name = "dbgen-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
env_logger = "0.10.0"
log = "0.4.20"
deadpool-postgres = "0.14.1"
tokio-postgres = { version = "0.7.16", features = ["with-chrono-0_4"] }
pg_bigdecimal = "0.1.5"

tiberius = { version = "0.12", default-features = false, features = [
    "tds73",
    "chrono",
    "native-tls",
] }
chrono = "0.4"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }

tpchgen = "2.0.2"
tpchgen-arrow = "2.0.2"
clap = { version = "4.5", features = ["derive"] }
arrow = "57.1"
deadpool-tiberius = "0.1"
oracle = { version = "0.6", features = ["chrono"] }

[patch.crates-io]
tiberius = { git = "https://github.com/shubhamsinha/tiberius-optimized", rev = "57b68bc9d54fa0d044d78940d97a4a243e8cdd8c" }
deadpool-tiberius = { git = "https://github.com/shubhamsinha/deadpool-tiberius", rev = "d85c8df34325d6be2a95196bb513b1fe1d4a07b5" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
